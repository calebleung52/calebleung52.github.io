<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenBVE Projects | Caleb Studio</title>
    <style>
        /* Apple 簡約風格基礎 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #000; color: #f5f5f7; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 1000px; margin: 0 auto; padding: 4rem 2rem; flex: 1; }
        
        /* JR 東日本風格 Header */
        header { border-bottom: 3px solid #0066cc; padding-bottom: 1rem; margin-bottom: 2rem; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #0066cc; letter-spacing: -0.5px; }
        
        h1 { font-size: 2.5rem; margin-bottom: 2rem; }
        h2 { border-left: 5px solid #0066cc; padding-left: 1rem; margin: 3rem 0 1.5rem 0; font-size: 1.5rem; }
        
        /* 網格與卡片 */
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .project-card { background: #161617; border-radius: 12px; padding: 1.5rem; border: 1px solid #333; }
        
        /* 線路標籤 (JR 風格 Badge) */
        .line-badge { background: #0066cc; color: white; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-bottom: 0.8rem; display: inline-block; }
        
        /* 按鈕 */
        .download-btn { display: inline-block; background: #fff; color: #000; padding: 0.6rem 1.2rem; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; margin-top: 1rem; transition: 0.2s; }
        .download-btn:hover { background: #0066cc; color: #fff; }
        
        /* Footer */
        footer { text-align: center; padding: 3rem; color: #555; font-size: 0.8rem; border-top: 1px solid #333; margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">Caleb Studio</div>
        </div>
    </header>

    <div class="container">
        <a href="index.html" style="color:#0066cc; text-decoration:none;">← Back to Home</a>
        <h1>OpenBVE Projects</h1>

        <h2>🇭🇰 Hong Kong </h2>
        <div class="projects-grid">
            <div class="project-card">
                <span class="line-badge">MTR</span>
                <h3>Hong Kong Railway Company</h3>
                <p style="color:#86868b; font-size: 0.9rem;">High-fidelity route simulation.</p>
                <a href="填入OneDrive連結" class="download-btn">Download Data</a>
            </div>
        </div>

        <h2>🇯🇵 Japan</h2>
        <div class="projects-grid">
            <div class="project-card">
                <span class="line-badge" style="background:#e60012;">JR,Tokyo Metro, Keikyu</span>
                <h3>在來線(Normal Train Line), 新幹線 (Shinkansen)</h3>
                <p style="color:#86868b; font-size: 0.9rem;">Complete route pack.</p>
                <a href="填入OneDrive連結" class="download-btn">Download Data</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Caleb Studio. All rights reserved.</p>
    </footer>

</body>
</html>
