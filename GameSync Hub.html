<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameSync - Ala Mobile & TJA Hub | Caleb Studio</title>
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #050505;
            --bg-card: #1c1c1e;
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-tertiary: #86868b;
            --border-color: rgba(255, 255, 255, 0.1);
            --button-bg: #0071e3;
            --button-hover: #147ce5;
            --link-color: #2997ff;
            --nav-bg: rgba(22, 22, 23, 0.8);
            --premium-bg: rgba(255, 69, 58, 0.05);
            --premium-border: #ff453a;
        }

        body.light-mode {
            --bg-primary: #f5f5f7;
            --bg-secondary: #e8e8ed;
            --bg-card: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #86868b;
            --border-color: rgba(0, 0, 0, 0.1);
            --button-bg: #0071e3;
            --button-hover: #147ce5;
            --link-color: #0071e3;
            --nav-bg: rgba(255, 255, 255, 0.8);
            --premium-bg: rgba(255, 69, 58, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            transition: all 0.3s ease;
        }

        header {
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        nav .logo {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        nav a:hover { color: var(--text-primary); }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .theme-toggle svg { width: 22px; height: 22px; stroke: currentColor; fill: none; }
        body.light-mode .theme-toggle .moon-icon { display: block; }
        body.light-mode .theme-toggle .sun-icon { display: none; }
        .theme-toggle .moon-icon { display: none; }
        .theme-toggle .sun-icon { display: block; }

        .hero {
            text-align: center;
            padding: 4rem 2rem 2rem;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, var(--text-primary) 0%, var(--text-tertiary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-tertiary);
        }

        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.7rem 2rem;
            border-radius: 980px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--button-bg);
            color: white;
            border-color: var(--button-bg);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        /* 两栏布局 */
        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .column {
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .column-header {
            padding: 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .column-header h2 {
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
        }

        .column-header .free-badge {
            display: inline-block;
            background: #30d158;
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 980px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .column-header .premium-badge {
            display: inline-block;
            background: #ff453a;
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 980px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        /* 免费内容列表 */
        .free-list {
            padding: 1rem;
        }

        .free-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .free-item:last-child {
            border-bottom: none;
        }

        .item-info h4 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }

        .item-info p {
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        .download-link {
            background: var(--button-bg);
            color: white;
            text-decoration: none;
            padding: 0.4rem 1rem;
            border-radius: 980px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .download-link:hover {
            background: var(--button-hover);
        }

        /* 高级内容预览 */
        .preview-list {
            padding: 1rem;
        }

        .preview-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--premium-bg);
        }

        .preview-item:last-child {
            border-bottom: none;
        }

        .preview-item h4 {
            font-size: 1rem;
            color: #ff453a;
            margin-bottom: 0.3rem;
        }

        .preview-item p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .preview-tag {
            display: inline-block;
            font-size: 0.7rem;
            color: #ff453a;
            margin-top: 0.3rem;
        }

        .coming-soon {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-tertiary);
            font-style: italic;
        }

        footer {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-tertiary);
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .split-layout { grid-template-columns: 1fr; }
            .hero h1 { font-size: 2rem; }
            nav ul li:not(:last-child) { display: none; }
        }
    </style>
</head>
<body>

<header>
    <nav>
        <a href="index.html" class="logo">
            <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="32" height="32" rx="8" fill="#0071e3"/>
                <path d="M10 16L14 12L18 16L22 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M10 20L14 16L18 20L22 16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="16" cy="16" r="2" fill="white"/>
            </svg>
            Caleb
        </a>
        <ul>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#projects">Projects</a></li>
            <li><a href="alliance.html">Alliance</a></li>
            <li><a href="gamesync.html" style="color: var(--link-color);">GameSync</a></li>
            <li><a href="legal.html">Legal</a></li>
            <li>
                <button id="theme-toggle" class="theme-toggle">
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </li>
        </ul>
    </nav>
</header>

<div class="hero">
    <h1>🎮 GameSync</h1>
    <p>Free Ala Mobile setups & Taiko TJA charts. Premium coming soon.</p>
</div>

<div class="category-tabs">
    <button class="tab-btn active" data-category="ala">🏎️ Ala Mobile</button>
    <button class="tab-btn" data-category="tja">🥁 Taiko TJA</button>
</div>

<div class="container">
    <div id="dynamic-content">
        <!-- JS 会动态渲染这里 -->
    </div>
</div>

<footer>
    <p>© 2026 Caleb Studio · GameSync · Free content + Premium upgrades coming soon</p>
</footer>

<script>
    // ==================== 内容数据 ====================
    const contentData = {
        ala: {
            free: [
                { name: "McLaren Senna GTR", desc: "Satin blue with carbon accents", link: "https://1drv.ms/f/c/15eb311a8dd976a8/IgCh5JA_STW_Qqt7fe0YkZTxATIZiY-i-r4xv_H4l7MfvHg?e=EYhQpm" },
                { name: "Ferrari F40 Competizione", desc: "Classic red with gold rims", link: "#" },
                { name: "Nissan GT-R Nismo", desc: "R35 spec-V inspired livery", link: "#" },
                { name: "Lamborghini Huracán STO", desc: "Verde Mantis green", link: "#" }
            ],
            premium: [
                { name: "Porsche 911 GT3 RS", desc: "Mega rare 'Ruby Star' custom paint + performance tune" },
                { name: "Ala Edition: Carbon Series", desc: "Full carbon fiber body + engine map + suspension setup" },
                { name: "VIP Pack: 10 Exclusive Liveries", desc: "Limited designs from real racing teams" },
                { name: "Pro Setup Tool", desc: "Drag-and-drop performance tuning interface" }
            ]
        },
        tja: {
            free: [
                { name: "紅蓮華 - LiSA", desc: "鬼滅の刃 OP · ★7 · Oni chart included", link: "#" },
                { name: " idol - YOASOBI", desc: "★8 · Full song + Ura chart", link: "#" },
                { name: "Bling-Bang-Bang-Born - Creepy Nuts", desc: "★8 · Mashle OP · Includes practice chart", link: "#" },
                { name: "God-ish - PinocchioP", desc: "★7 · Vocaloid classic", link: "#" }
            ],
            premium: [
                { name: "KICK BACK - 米津玄師", desc: "Chainsaw Man OP · ★9 + ★10 Ura · 4K video sync" },
                { name: "MEGALOVANIA (Undertale)", desc: "★10 Sans fight theme · Hardest chart ever" },
                { name: "Song Pack: Anime Hits Vol.1", desc: "5 songs (Jujutsu Kaisen, Oshi no Ko, Spy x Family)" },
                { name: "TJA Editor Pro", desc: "Mobile chart editor + auto BPM detection + cloud save" }
            ]
        }
    };

    let currentCategory = "ala";

    function renderContent() {
        const container = document.getElementById("dynamic-content");
        const data = contentData[currentCategory];
        
        const html = `
            <div class="split-layout">
                <!-- 左侧：免费内容 -->
                <div class="column">
                    <div class="column-header">
                        <h2>🎁 Free</h2>
                        <div class="free-badge">Download Now</div>
                    </div>
                    <div class="free-list">
                        ${data.free.map(item => `
                            <div class="free-item">
                                <div class="item-info">
                                    <h4>${item.name}</h4>
                                    <p>${item.desc}</p>
                                </div>
                                <a href="${item.link}" class="download-link" target="_blank">⬇️ Get</a>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- 右侧：高级内容预览 -->
                <div class="column">
                    <div class="column-header">
                        <h2>💎 Premium</h2>
                        <div class="premium-badge">Coming Soon</div>
                    </div>
                    <div class="preview-list">
                        ${data.premium.map(item => `
                            <div class="preview-item">
                                <h4>✨ ${item.name}</h4>
                                <p>${item.desc}</p>
                                <div class="preview-tag">🔒 Unlock with in-app purchase</div>
                            </div>
                        `).join('')}
                        <div class="coming-soon">
                            More content added monthly · Subscribe for updates
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        container.innerHTML = html;
    }

    // Tab 切换
    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentCategory = btn.dataset.category;
            renderContent();
        });
    });

    // 主题切换
    const themeToggle = document.getElementById("theme-toggle");
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "light") document.body.classList.add("light-mode");
    themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("light-mode");
        localStorage.setItem("theme", document.body.classList.contains("light-mode") ? "light" : "dark");
    });

    // 初次渲染
    renderContent();
</script>

</body>
</html>
